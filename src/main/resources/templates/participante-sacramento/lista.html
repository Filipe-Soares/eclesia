<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Participantes do Sacramento - ADM Eclesial')}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h3 mb-1 text-gray-800">Participantes do Sacramento</h1>
                        <p class="text-muted mb-0">Recebedores, celebrantes, testemunhas e padrinhos vinculados à celebração</p>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{/sacramentos/{uuid}(uuid=${sacramentoUuid})}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Voltar ao Sacramento
                        </a>
                        <a th:href="@{/sacramentos/{uuid}/participantes/novo(uuid=${sacramentoUuid})}" class="btn btn-eclesial">
                            <i class="bi bi-person-plus me-1"></i> Novo Participante
                        </a>
                    </div>
                </div>

                <th:block th:if="${#lists.isEmpty(participantes)}">
                    <section th:replace="~{fragments/layout :: empty-state('Nenhum participante vinculado.', 'Adicione pessoas e seus papéis litúrgicos a esta celebração sacramental.')}"></section>
                </th:block>

                <div class="card shadow-sm border-0" th:unless="${#lists.isEmpty(participantes)}">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Pessoa</th>
                                    <th>Participação</th>
                                    <th>Observações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${participantes}">
                                    <td class="fw-semibold text-dark" th:text="${p.pessoaNome}"></td>
                                    <td>
                                        <span class="badge bg-primary-subtle text-primary border border-primary-subtle" th:text="${p.tipoParticipacao}"></span>
                                    </td>
                                    <td class="text-muted small" th:text="${p.observacao ?: '-'}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
