<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Adicionar Participante - ADM Eclesial')}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h3 mb-1 text-gray-800">Novo Participante Sacramental</h1>
                        <p class="text-muted mb-0">Associe uma pessoa e seu papel na celebração sacramental</p>
                    </div>
                    <a th:href="@{/sacramentos/{uuid}/participantes(uuid=${sacramentoUuid})}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Voltar para Participantes
                    </a>
                </div>

                <div th:if="${businessError}" class="alert alert-danger mb-4" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${businessError}"></span>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <form th:action="@{/sacramentos/{uuid}/participantes(uuid=${sacramentoUuid})}" th:object="${request}" method="post">
      <div th:replace="~{fragments/layout :: formErrors}"></div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Pessoa <span class="text-danger">*</span></label>
                                    <select th:field="*{pessoaUuid}" class="form-select" required>
                                        <option value="">Selecione uma pessoa</option>
                                        <option th:each="p : ${pessoas}" th:value="${p.uuid}" th:text="${p.nome}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Tipo de Participação <span class="text-danger">*</span></label>
                                    <select th:field="*{tipoParticipacao}" class="form-select" required>
                                        <option value="">Selecione a participação</option>
                                        <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Observações</label>
                                <textarea th:field="*{observacao}" class="form-control" rows="4" placeholder="Detalhes ou anotações sobre o participante..."></textarea>
                            </div>

                            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                <a th:href="@{/sacramentos/{uuid}/participantes(uuid=${sacramentoUuid})}" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                                <button type="submit" class="btn btn-eclesial">
                                    <i class="bi bi-person-check me-1"></i> Adicionar Participante
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
