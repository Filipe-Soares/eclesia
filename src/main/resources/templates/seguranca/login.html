<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: assets('Login')}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - ADM Eclesial</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

  <main class="container" style="max-width: 420px;">
    <div class="card shadow-sm border-0 p-4 p-sm-5 bg-white rounded-3">
      
      <!-- Cabeçalho / Identidade -->
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary-subtle text-primary mb-3 shadow-sm" style="width: 64px; height: 64px;">
          <i class="bi bi-bank2 fs-2 text-warning"></i>
        </div>
        <h1 class="h4 fw-bold text-dark mb-1">ADM Eclesial</h1>
        <p class="text-muted small mb-0">Gestão Paroquial</p>
      </div>

      <!-- Alertas de Feedback -->
      <div class="alert alert-danger d-flex align-items-center gap-2 shadow-sm border-0 py-2 px-3 mb-3 small" role="alert" th:if="${param.error}">
        <i class="bi bi-exclamation-triangle-fill text-danger fs-5 flex-shrink-0"></i>
        <span>Login ou senha inválidos.</span>
      </div>

      <div class="alert alert-info d-flex align-items-center gap-2 shadow-sm border-0 py-2 px-3 mb-3 small" role="alert" th:if="${param.logout}">
        <i class="bi bi-info-circle-fill text-info fs-5 flex-shrink-0"></i>
        <span>Sessão encerrada com sucesso.</span>
      </div>

      <!-- Formulário de Autenticação -->
      <form th:action="@{/login}" method="post">
        
        <div class="mb-3">
          <label class="form-label small fw-semibold text-muted" for="username">Usuário / Login</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0">
              <i class="bi bi-person"></i>
            </span>
            <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="Digite seu usuário" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold text-muted" for="password">Senha</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0">
              <i class="bi bi-key"></i>
            </span>
            <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Digite sua senha" required>
          </div>
        </div>

        <button type="submit" class="btn btn-eclesial w-100 py-2 fw-medium shadow-sm d-flex align-items-center justify-content-center gap-2">
          <i class="bi bi-box-arrow-in-right"></i>
          <span>Entrar no Sistema</span>
        </button>

      </form>

    </div>
    
    <div class="text-center mt-3 text-muted fs-8">
      <span>ADM Eclesial &copy; 2026 — Todos os direitos reservados</span>
    </div>
  </main>

</body>
</html>
