<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets(${pessoaUuid != null ? 'Editar Pessoa' : 'Nova Pessoa'})}">
  <meta charset="UTF-8">
  <title th:text="${pessoaUuid != null ? 'Editar Pessoa - ADM Eclesial' : 'Nova Pessoa - ADM Eclesial'}">Pessoa - ADM Eclesial</title>
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar}"></aside>
  
  <main class="app-main">
    <div class="page">
      
      <!-- Cabeçalho -->
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-4 pb-2 border-bottom">
        <div>
          <h1 class="h3 fw-bold text-dark mb-1">
            <i class="bi bi-person-gear text-primary me-2" th:if="${pessoaUuid != null}"></i>
            <i class="bi bi-person-plus text-primary me-2" th:unless="${pessoaUuid != null}"></i>
            <span th:text="${pessoaUuid != null ? 'Editar Pessoa' : 'Nova Pessoa'}">Pessoa</span>
          </h1>
          <p class="text-muted small mb-0" th:text="${pessoaUuid != null ? 'Atualize os dados cadastrais da pessoa' : 'Cadastre os dados básicos da pessoa'}"></p>
        </div>
        <div>
          <a class="btn btn-outline-secondary d-flex align-items-center gap-1" th:href="@{/pessoas}">
            <i class="bi bi-arrow-left"></i>
            <span>Voltar para Lista</span>
          </a>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: feedback}"></div>

      <!-- Formulário em Card -->
      <div class="card border-0 shadow-sm p-4 p-md-5 mb-4" style="max-width: 920px;">
        
        <form th:action="${pessoaUuid != null ? '/pessoas/' + pessoaUuid + '/editar' : '/pessoas'}" th:object="${pessoaRequest}" method="post">
      <div th:replace="~{fragments/layout :: formErrors}"></div>
          
          <div class="alert alert-danger shadow-sm border-0 d-flex align-items-center gap-2 mb-4" th:if="${#fields.hasGlobalErrors()}">
            <i class="bi bi-exclamation-triangle-fill fs-5 text-danger flex-shrink-0"></i>
            <div>
              <div class="fw-bold">Revise os dados informados:</div>
              <ul class="mb-0 ps-3 small">
                <li th:each="e : ${#fields.globalErrors()}" th:text="${e}"></li>
              </ul>
            </div>
          </div>

          <div class="row g-3">
            
            <div class="col-12">
              <label class="form-label small fw-semibold text-muted" for="nome">Nome Completo <span class="text-danger">*</span></label>
              <input id="nome" type="text" class="form-control" th:field="*{nome}" th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'" autofocus placeholder="Nome da pessoa">
              <div class="invalid-feedback" th:errors="*{nome}"></div>
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label small fw-semibold text-muted" for="nomeSocial">Nome Social</label>
              <input id="nomeSocial" type="text" class="form-control" th:field="*{nomeSocial}" placeholder="Como prefere ser chamado(a)">
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label small fw-semibold text-muted" for="dataNascimento">Data de Nascimento</label>
              <input id="dataNascimento" type="date" class="form-control" th:field="*{dataNascimento}">
            </div>

            <div class="col-12 col-md-4">
              <label class="form-label small fw-semibold text-muted" for="sexo">Sexo</label>
              <select id="sexo" class="form-select" th:field="*{sexo}">
                <option value="">Selecione</option>
                <option th:each="sexo : ${sexos}" th:value="${sexo}" th:text="${sexo}"></option>
              </select>
            </div>

            <div class="col-12 col-md-4">
              <label class="form-label small fw-semibold text-muted" for="cpf">CPF</label>
              <input id="cpf" type="text" inputmode="numeric" class="form-control" th:field="*{cpf}" placeholder="Somente números">
              <span class="form-text fs-8 text-muted">Informe somente os dígitos.</span>
            </div>

            <div class="col-12 col-md-4">
              <label class="form-label small fw-semibold text-muted" for="rg">RG</label>
              <input id="rg" type="text" class="form-control" th:field="*{rg}" placeholder="Documento de identidade">
            </div>

            <div class="col-12">
              <label class="form-label small fw-semibold text-muted" for="email">E-mail</label>
              <input id="email" type="email" class="form-control" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" placeholder="exemplo@dominio.com">
              <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>

            <div class="col-12">
              <label class="form-label small fw-semibold text-muted" for="observacao">Observações</label>
              <textarea id="observacao" rows="3" class="form-control" th:field="*{observacao}" placeholder="Observações pastorais ou cadastrais"></textarea>
            </div>

          </div>

          <div class="d-flex gap-2 align-items-center mt-4 pt-3 border-top">
            <button type="submit" class="btn btn-eclesial px-4 shadow-sm">
              <i class="bi bi-check-lg me-1"></i>
              <span th:text="${pessoaUuid != null ? 'Atualizar Pessoa' : 'Salvar Pessoa'}">Salvar</span>
            </button>
            <a class="btn btn-outline-secondary px-3" th:href="@{/pessoas}">Cancelar</a>
          </div>

        </form>

      </div>

    </div>
  </main>
</div>

</body>
</html>
