<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets(${pessoa.nome})}">
  <meta charset="UTF-8">
  <title th:text="${pessoa.nome} + ' - ADM Eclesial'">Pessoa</title>
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar}"></aside>
  
  <main class="app-main">
    <div class="page">
      
      <!-- Cabeçalho -->
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-4 pb-2 border-bottom">
        <div>
          <div class="d-flex align-items-center gap-2 mb-1">
            <h1 class="h3 fw-bold text-dark mb-0" th:text="${pessoa.nome}">Pessoa</h1>
            <span class="badge" th:classappend="${pessoa.ativo} ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-danger-subtle text-danger border border-danger-subtle'" th:text="${pessoa.ativo ? 'Ativo' : 'Inativo'}"></span>
          </div>
          <p class="text-muted small mb-0">Ficha cadastral da pessoa</p>
        </div>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-secondary d-flex align-items-center gap-1" th:href="@{/pessoas}">
            <i class="bi bi-arrow-left"></i>
            <span>Voltar para Lista</span>
          </a>
          <a class="btn btn-outline-primary d-flex align-items-center gap-1" th:href="@{/pessoas/{uuid}/editar(uuid=${pessoa.uuid})}">
            <i class="bi bi-pencil"></i>
            <span>Editar</span>
          </a>
          <a class="btn btn-eclesial d-flex align-items-center gap-1" th:href="@{/pessoas/nova}">
            <i class="bi bi-plus-lg"></i>
            <span>Nova Pessoa</span>
          </a>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: feedback}"></div>

      <!-- Detalhes em Card -->
      <div class="card border-0 shadow-sm p-4 mb-4" style="max-width: 800px;">
        <div class="row g-3">
          <div class="col-12 col-sm-6">
            <label class="form-label text-muted small fw-semibold mb-1">Identificador (UUID)</label>
            <div class="font-monospace text-dark bg-light p-2 rounded border border-light-subtle small" th:text="${pessoa.uuid}"></div>
          </div>
          <div class="col-12 col-sm-6">
            <label class="form-label text-muted small fw-semibold mb-1">CPF</label>
            <div class="fw-medium text-dark bg-light p-2 rounded border border-light-subtle" th:text="${pessoa.cpf != null and !pessoa.cpf.isBlank() ? pessoa.cpf : 'Não informado'}"></div>
          </div>
          <div class="col-12 col-sm-6">
            <label class="form-label text-muted small fw-semibold mb-1">E-mail</label>
            <div class="fw-medium text-dark bg-light p-2 rounded border border-light-subtle" th:text="${pessoa.email != null and !pessoa.email.isBlank() ? pessoa.email : 'Não informado'}"></div>
          </div>
          <div class="col-12 col-sm-6">
            <label class="form-label text-muted small fw-semibold mb-1">Situação Cadastral</label>
            <div class="p-2">
              <span class="badge" th:classappend="${pessoa.ativo} ? 'bg-success text-white' : 'bg-danger text-white'" th:text="${pessoa.ativo ? 'Cadastro Ativo' : 'Cadastro Inativo'}"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Famílias -->
      <div class="card border-0 shadow-sm p-4 mb-4" style="max-width: 900px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h5 fw-bold text-dark mb-0"><i class="bi bi-people-fill me-2 text-primary"></i>Famílias</h2>
          <a class="btn btn-sm btn-outline-secondary" th:href="@{/familias}"><i class="bi bi-box-arrow-up-right me-1"></i>Gerenciar famílias</a>
        </div>
        <div th:if="${#lists.isEmpty(familiasDoMembro)}" class="text-muted small">Esta pessoa não está associada a nenhuma família.</div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(familiasDoMembro)}">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr><th>Família</th><th>Tipo</th><th>Início</th><th>Fim</th></tr>
            </thead>
            <tbody>
              <tr th:each="m : ${familiasDoMembro}">
                <td><a th:href="@{/familias/{uuid}(uuid=${m.familiaUuid})}" class="text-decoration-none fw-medium" th:text="${m.familiaNome}"></a></td>
                <td><span class="badge bg-light text-dark border" th:text="${m.tipo}"></span></td>
                <td th:text="${m.dataInicio}"></td>
                <td th:text="${m.dataFim != null ? m.dataFim : '—'}"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Relacionamentos -->
      <div class="card border-0 shadow-sm p-4 mb-4" style="max-width: 900px;">
        <h2 class="h5 fw-bold text-dark mb-3"><i class="bi bi-diagram-2 me-2 text-primary"></i>Relacionamentos</h2>
        <div th:if="${#lists.isEmpty(relacionamentos)}" class="text-muted small mb-3">Nenhum relacionamento registrado.</div>
        <div class="table-responsive mb-3" th:unless="${#lists.isEmpty(relacionamentos)}">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr><th>Pessoa</th><th>Relacionamento</th><th>Início</th><th>Fim</th><th class="text-end">Ações</th></tr>
            </thead>
            <tbody>
              <tr th:each="r : ${relacionamentos}">
                <td>
                  <a th:if="${r.outraPessoaUuid != null}" th:href="@{/pessoas/{uuid}(uuid=${r.outraPessoaUuid})}" class="text-decoration-none fw-medium" th:text="${r.outraPessoaNome}"></a>
                  <span th:if="${r.outraPessoaUuid == null}" th:text="${r.outraPessoaNome}"></span>
                </td>
                <td><span class="badge bg-light text-dark border" th:text="${r.tipo}"></span></td>
                <td th:text="${r.dataInicio}"></td>
                <td th:text="${r.dataFim != null ? r.dataFim : '—'}"></td>
                <td class="text-end">
                  <form th:action="@{/pessoas/{uuid}/relacionamentos/{relUuid}/remover(uuid=${pessoa.uuid},relUuid=${r.relacionamentoUuid})}" method="post" class="d-inline"
                        sec:authorize="hasAnyRole('ADMINISTRADOR','SECRETARIA')">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Remover</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <form th:action="@{/pessoas/{uuid}/relacionamentos(uuid=${pessoa.uuid})}" method="post" class="row g-2 align-items-end border-top pt-3"
              sec:authorize="hasAnyRole('ADMINISTRADOR','SECRETARIA')">
          <div class="col-12 col-md-5">
            <label class="form-label small fw-semibold text-muted" for="outraPessoaUuid">Outra pessoa</label>
            <select id="outraPessoaUuid" name="outraPessoaUuid" class="form-select" required>
              <option value="">Selecione</option>
              <option th:each="p : ${pessoas}" th:if="${p.uuid != pessoa.uuid}" th:value="${p.uuid}" th:text="${p.nome}"></option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label small fw-semibold text-muted" for="tipo">Relacionamento</label>
            <select id="tipo" name="tipo" class="form-select" required>
              <option th:each="t : ${tiposRelacionamento}" th:value="${t}" th:text="${t}"></option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label small fw-semibold text-muted" for="dataInicio">Início</label>
            <input id="dataInicio" type="date" name="dataInicio" class="form-control" required>
          </div>
          <div class="col-12 col-md-2">
            <button type="submit" class="btn btn-eclesial w-100"><i class="bi bi-plus-lg me-1"></i>Adicionar</button>
          </div>
        </form>
      </div>

    </div>
  </main>
</div>

</body>
</html>
