<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets(${organizacaoUuid != null ? 'Editar Organização Eclesial' : 'Nova Organização Eclesial'})}">
  <meta charset="UTF-8">
  <title th:text="${organizacaoUuid != null ? 'Editar organização eclesial - ADM Eclesial' : 'Nova organização eclesial - ADM Eclesial'}">Organização eclesial - ADM Eclesial</title>
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar}"></aside>
  
  <main class="app-main">
    <div class="page">
      
      <!-- Cabeçalho -->
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-4 pb-2 border-bottom">
        <div>
          <h1 class="h3 fw-bold text-dark mb-1">
            <i class="bi bi-building-gear text-primary me-2" th:if="${organizacaoUuid != null}"></i>
            <i class="bi bi-building-add text-primary me-2" th:unless="${organizacaoUuid != null}"></i>
            <span th:text="${organizacaoUuid != null ? 'Editar Organização Eclesial' : 'Nova Organização Eclesial'}">Organização</span>
          </h1>
          <p class="text-muted small mb-0" th:text="${organizacaoUuid != null ? 'Atualize os dados institucionais da organização' : 'Informe os dados institucionais da organização'}"></p>
        </div>
        <div>
          <a class="btn btn-outline-secondary d-flex align-items-center gap-1" th:href="@{/organizacoes-eclesiais}">
            <i class="bi bi-arrow-left"></i>
            <span>Voltar para Lista</span>
          </a>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: feedback}"></div>

      <!-- Formulário em Card -->
      <div class="card border-0 shadow-sm p-4 p-md-5 mb-4" style="max-width: 920px;">
        <form th:action="${organizacaoUuid != null ? '/organizacoes-eclesiais/' + organizacaoUuid + '/editar' : '/organizacoes-eclesiais'}" th:object="${request}" method="post">
      <div th:replace="~{fragments/layout :: formErrors}"></div>
          
          <div class="row g-3">
            
            <div class="col-12">
              <label class="form-label small fw-semibold text-muted" for="nome">Nome Institucional <span class="text-danger">*</span></label>
              <input id="nome" type="text" class="form-control" th:field="*{nome}" th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'" autofocus placeholder="Ex: Paróquia São Francisco de Assis">
              <div class="invalid-feedback" th:errors="*{nome}"></div>
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label small fw-semibold text-muted" for="nomeReduzido">Nome Reduzido / Fantasia</label>
              <input id="nomeReduzido" type="text" class="form-control" th:field="*{nomeReduzido}" placeholder="Ex: São Francisco">
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label small fw-semibold text-muted" for="tipo">Tipo de Organização <span class="text-danger">*</span></label>
              <select id="tipo" class="form-select" th:field="*{tipo}" th:classappend="${#fields.hasErrors('tipo')} ? 'is-invalid'">
                <option value="">Selecione</option>
                <option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo}"></option>
              </select>
              <div class="invalid-feedback" th:errors="*{tipo}"></div>
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label small fw-semibold text-muted" for="cnpj">CNPJ</label>
              <input id="cnpj" type="text" inputmode="numeric" class="form-control" th:field="*{cnpj}" th:classappend="${#fields.hasErrors('cnpj')} ? 'is-invalid'" placeholder="Somente números (14 dígitos)">
              <div class="invalid-feedback" th:errors="*{cnpj}"></div>
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label small fw-semibold text-muted" for="telefone">Telefone</label>
              <input id="telefone" type="text" class="form-control" th:field="*{telefone}" placeholder="(XX) XXXXX-XXXX">
            </div>

            <div class="col-12">
              <label class="form-label small fw-semibold text-muted" for="email">E-mail</label>
              <input id="email" type="email" class="form-control" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" placeholder="contato@paroquia.org">
              <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>

            <div class="col-12">
              <label class="form-label small fw-semibold text-muted" for="observacao">Observações</label>
              <textarea id="observacao" rows="3" class="form-control" th:field="*{observacao}" placeholder="Observações eclesiásticas ou canônicas"></textarea>
            </div>

          </div>

          <div class="d-flex gap-2 align-items-center mt-4 pt-3 border-top">
            <button type="submit" class="btn btn-eclesial px-4 shadow-sm">
              <i class="bi bi-check-lg me-1"></i>
              <span th:text="${organizacaoUuid != null ? 'Atualizar Organização' : 'Salvar Organização'}">Salvar</span>
            </button>
            <a class="btn btn-outline-secondary px-3" th:href="@{/organizacoes-eclesiais}">Cancelar</a>
          </div>

        </form>
      </div>

    </div>
  </main>
</div>

</body>
</html>
