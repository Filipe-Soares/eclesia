<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Funções Atribuídas - ADM Eclesial')}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h3 mb-1 text-gray-800">Funções Eclesiais Atribuídas</h1>
                        <p class="text-muted mb-0">Ministérios, ofícios e funções pastorais designadas a membros e colaboradores</p>
                    </div>
                    <a sec:authorize="hasAnyRole('ADMINISTRADOR','SECRETARIA')" href="/vinculos-funcoes-eclesiais/novo" class="btn btn-eclesial">
                        <i class="bi bi-plus-lg me-1"></i> Atribuir Função
                    </a>
                </div>

                <th:block th:if="${#lists.isEmpty(funcoesVinculadas)}">
                    <section th:replace="~{fragments/layout :: empty-state('Nenhuma função eclesial atribuída.', 'Atribua ministérios ou funções pastorais às pessoas vinculadas.')}"></section>
                </th:block>

                <div class="card shadow-sm border-0" th:unless="${#lists.isEmpty(funcoesVinculadas)}">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Pessoa</th>
                                    <th>Organização</th>
                                    <th>Função Eclesial</th>
                                    <th>Período</th>
                                    <th>Principal</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="v : ${funcoesVinculadas}">
                                    <td class="fw-semibold text-dark" th:text="${v.pessoaNome}"></td>
                                    <td th:text="${v.organizacaoNome}"></td>
                                    <td>
                                        <span class="badge bg-primary-subtle text-primary border border-primary-subtle" th:text="${v.funcaoCodigo + ' — ' + v.funcaoNome}"></span>
                                    </td>
                                    <td>
                                        <i class="bi bi-calendar-range me-1 text-muted"></i>
                                        <span th:text="${v.dataInicio}"></span>
                                        <span class="text-muted"> a </span>
                                        <span th:text="${v.dataFim ?: 'Atual'}"></span>
                                    </td>
                                    <td>
                                        <span th:if="${v.principal}" class="badge bg-success-subtle text-success border border-success-subtle">Sim</span>
                                        <span th:unless="${v.principal}" class="badge bg-light text-secondary border">Não</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
