<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets(${'Turmas - ' + etapa.nome})}">
  <meta charset="UTF-8">
  <title th:text="'Turmas - ' + ${etapa.nome} + ' - ADM Eclesial'"></title>
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar}"></aside>
  
  <main class="app-main">
    <div class="page">
      
      <!-- Cabeçalho -->
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-4 pb-2 border-bottom">
        <div>
          <div class="d-flex align-items-center gap-2 mb-1">
            <h1 class="h3 fw-bold text-dark mb-0" th:text="'Turmas: ' + ${etapa.nome}">Turmas</h1>
            <span class="badge bg-light text-muted border" th:text="${etapa.catequeseNome}"></span>
          </div>
          <p class="text-muted small mb-0">Gestão das turmas da etapa de catequese</p>
        </div>
        <div class="d-flex gap-2 flex-wrap">
          <a class="btn btn-outline-secondary d-flex align-items-center gap-1" th:href="@{/catequeses/{uuid}/etapas(uuid=${etapa.catequeseUuid})}">
            <i class="bi bi-arrow-left"></i>
            <span>Voltar para Etapas</span>
          </a>
          <a class="btn btn-eclesial d-flex align-items-center gap-1 shadow-sm" th:href="@{/catequeses/etapas/{uuid}/turmas/nova(uuid=${etapa.uuid})}">
            <i class="bi bi-plus-lg"></i>
            <span>Nova Turma</span>
          </a>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: feedback}"></div>

      <!-- Empty State -->
      <th:block th:if="${#lists.isEmpty(turmas)}">
        <section th:replace="~{fragments/layout :: empty-state('Nenhuma turma cadastrada.', 'Cadastre uma turma para esta etapa de catequese.')}">
        </section>
      </th:block>

      <!-- Tabela de Listagem -->
      <div class="card border-0 shadow-sm" th:unless="${#lists.isEmpty(turmas)}">
        <div class="table-responsive">
          <table class="table table-hover table-striped align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3">Turma</th>
                <th>Ano</th>
                <th>Turno</th>
                <th>Período</th>
                <th>Capacidade</th>
                <th>Local</th>
                <th>Status</th>
                <th class="text-end pe-3">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="turma : ${turmas}">
                <td class="ps-3 fw-bold text-dark" th:text="${turma.nome}"></td>
                <td class="text-muted" th:text="${turma.ano ?: '—'}"></td>
                <td class="text-muted" th:text="${turma.turno ?: '—'}"></td>
                <td class="small text-muted">
                  <span th:text="${turma.dataInicio != null ? #temporals.format(turma.dataInicio, 'dd/MM/yyyy') : '-'}"></span>
                  <span> a </span>
                  <span th:text="${turma.dataFim != null ? #temporals.format(turma.dataFim, 'dd/MM/yyyy') : '-'}"></span>
                </td>
                <td th:text="${turma.capacidade ?: '—'}"></td>
                <td class="text-muted" th:text="${turma.local ?: '—'}"></td>
                <td>
                  <span class="badge" th:classappend="${turma.status == 'ATIVA' or turma.status == 'ATIVO'} ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-secondary-subtle text-dark border'" th:text="${turma.status}"></span>
                </td>
                <td class="text-end pe-3">
                  <div class="d-inline-flex gap-1">
                    <a class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center gap-1" th:href="@{/catequeses/turmas/{uuid}/inscricoes(uuid=${turma.uuid})}">
                      <i class="bi bi-people"></i>
                      <span>Inscrições</span>
                    </a>
                    <a class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center gap-1" th:href="@{/catequeses/turmas/{uuid}/catequistas(uuid=${turma.uuid})}">
                      <i class="bi bi-person-badge"></i>
                      <span>Catequistas</span>
                    </a>
                    <a class="btn btn-sm btn-outline-primary d-inline-flex align-items-center gap-1" th:href="@{/catequeses/etapas/{etapaUuid}/turmas/{uuid}/editar(etapaUuid=${etapa.uuid},uuid=${turma.uuid})}">
                      <i class="bi bi-pencil"></i>
                      <span>Editar</span>
                    </a>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>

</body>
</html>
