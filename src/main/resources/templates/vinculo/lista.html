<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Vínculos Pessoa × Organização - ADM Eclesial')}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h3 mb-1 text-gray-800">Vínculos Pessoa × Organização</h1>
                        <p class="text-muted mb-0">Associação institucional de fiéis às paróquias e comunidades</p>
                    </div>
                    <a sec:authorize="hasAnyRole('ADMINISTRADOR','SECRETARIA')" href="/vinculos-pessoa-organizacao/novo" class="btn btn-eclesial">
                        <i class="bi bi-plus-lg me-1"></i> Novo Vínculo
                    </a>
                </div>

                <th:block th:if="${#lists.isEmpty(vinculos)}">
                    <section th:replace="~{fragments/layout :: empty-state('Nenhum vínculo cadastrado.', 'Ainda não há vínculos entre pessoas e organizações para exibir.')}"></section>
                </th:block>

                <div class="card shadow-sm border-0" th:unless="${#lists.isEmpty(vinculos)}">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Pessoa</th>
                                    <th>Organização</th>
                                    <th>Período</th>
                                    <th>Status</th>
                                    <th>Principal</th>
                                    <th class="text-end pe-3">Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="v : ${vinculos}">
                                    <td class="fw-semibold text-dark" th:text="${v.pessoaNome}"></td>
                                    <td th:text="${v.organizacaoNome}"></td>
                                    <td>
                                        <i class="bi bi-calendar-range me-1 text-muted"></i>
                                        <span th:text="${v.dataInicio}"></span>
                                        <span class="text-muted"> a </span>
                                        <span th:text="${v.dataFim ?: 'Atual'}"></span>
                                    </td>
                                    <td>
                                        <span class="badge bg-primary-subtle text-primary border border-primary-subtle" th:text="${v.status}"></span>
                                    </td>
                                    <td>
                                        <span th:if="${v.principal}" class="badge bg-success-subtle text-success border border-success-subtle">Sim</span>
                                        <span th:unless="${v.principal}" class="badge bg-light text-secondary border">Não</span>
                                    </td>
                                    <td class="text-end pe-3">
                                        <div class="d-inline-flex gap-1">
                                            <a class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center gap-1" th:href="@{/vinculos-pessoa-organizacao/{uuid}(uuid=${v.uuid})}">
                                                <i class="bi bi-eye"></i>
                                                <span>Detalhes</span>
                                            </a>
                                            <a class="btn btn-sm btn-outline-primary d-inline-flex align-items-center gap-1" th:href="@{/vinculos-pessoa-organizacao/{uuid}/editar(uuid=${v.uuid})}">
                                                <i class="bi bi-pencil"></i>
                                                <span>Editar</span>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
