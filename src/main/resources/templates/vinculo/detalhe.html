<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Detalhes do Vínculo - ADM Eclesial')}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h3 mb-1 text-gray-800">Detalhes do Vínculo</h1>
                        <p class="text-muted mb-0">Associação de <strong th:text="${vinculo.pessoaNome}"></strong> com a organização</p>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="/vinculos-pessoa-organizacao" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Voltar aos Vínculos
                        </a>
                        <a th:href="@{/vinculos-pessoa-organizacao/{uuid}/editar(uuid=${vinculo.uuid})}" class="btn btn-outline-primary">
                            <i class="bi bi-pencil me-1"></i> Editar
                        </a>
                        <a href="/vinculos-funcoes-eclesiais/novo" class="btn btn-eclesial">
                            <i class="bi bi-plus-lg me-1"></i> Atribuir Função
                        </a>
                    </div>
                </div>

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-light fw-semibold">
                        <i class="bi bi-info-circle me-1"></i> Informações do Vínculo
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <small class="text-muted d-block">Pessoa</small>
                                <span class="fw-semibold fs-5 text-dark" th:text="${vinculo.pessoaNome}"></span>
                            </div>
                            <div class="col-md-6">
                                <small class="text-muted d-block">Organização Eclesial</small>
                                <span class="fw-semibold fs-5 text-dark" th:text="${vinculo.organizacaoNome}"></span>
                            </div>
                            <div class="col-md-4">
                                <small class="text-muted d-block">Período de Vigência</small>
                                <span th:text="${vinculo.dataInicio}"></span> a <span th:text="${vinculo.dataFim ?: 'Atual'}"></span>
                            </div>
                            <div class="col-md-4">
                                <small class="text-muted d-block">Situação</small>
                                <span class="badge bg-primary-subtle text-primary border border-primary-subtle" th:text="${vinculo.status}"></span>
                            </div>
                            <div class="col-md-4">
                                <small class="text-muted d-block">Vínculo Principal</small>
                                <span th:if="${vinculo.principal}" class="badge bg-success-subtle text-success border border-success-subtle">Sim</span>
                                <span th:unless="${vinculo.principal}" class="badge bg-light text-secondary border">Não</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
