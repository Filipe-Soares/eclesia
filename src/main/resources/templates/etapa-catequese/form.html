<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets(${edicao ? 'Editar Etapa' : 'Nova Etapa'} + ' - ADM Eclesial')}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h3 mb-1 text-gray-800" th:text="${edicao ? 'Editar Etapa' : 'Nova Etapa'}"></h1>
                        <p class="text-muted mb-0"><strong>Catequese:</strong> <span th:text="${catequese.nome}"></span></p>
                    </div>
                    <a th:href="@{/catequeses/{uuid}/etapas(uuid=${catequese.uuid})}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Voltar para Etapas
                    </a>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <form th:action="${edicao ? '/catequeses/' + catequese.uuid + '/etapas/' + uuid : '/catequeses/' + catequese.uuid + '/etapas'}"
                              th:object="${request}" method="post">
      <div th:replace="~{fragments/layout :: formErrors}"></div>

                            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger mb-4">
                                <ul class="mb-0">
                                    <li th:each="error : ${#fields.globalErrors()}" th:text="${error}"></li>
                                </ul>
                            </div>

                            <input type="hidden" th:field="*{catequeseUuid}">

                            <div class="row g-3 mb-3">
                                <div class="col-md-9">
                                    <label class="form-label fw-semibold">Nome da Etapa <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{nome}" class="form-control" maxlength="150" required placeholder="Ex: 1ª Eucaristia - Etapa 1">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">Ordem</label>
                                    <input type="number" th:field="*{ordem}" class="form-control" min="1" placeholder="1">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('ordem')}" th:errors="*{ordem}"></div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Descrição</label>
                                <textarea th:field="*{descricao}" class="form-control" rows="3" maxlength="5000" placeholder="Descrição detalhada dos objetivos desta etapa..."></textarea>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></div>
                            </div>

                            <div class="form-check form-switch mb-4">
                                <input class="form-check-input" type="checkbox" role="switch" id="ativo" th:field="*{ativo}">
                                <label class="form-check-label fw-semibold" for="ativo">Etapa Ativa</label>
                            </div>

                            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                <a th:href="@{/catequeses/{uuid}/etapas(uuid=${catequese.uuid})}" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                                <button type="submit" class="btn btn-eclesial">
                                    <i class="bi bi-check-lg me-1"></i> Salvar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
