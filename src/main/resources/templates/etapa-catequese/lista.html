<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Etapas - ' + ${catequese.nome} + ' - ADM Eclesial')}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h3 mb-1 text-gray-800" th:text="'Etapas: ' + ${catequese.nome}"></h1>
                        <p class="text-muted mb-0">
                            <strong>Organização:</strong> <span th:text="${catequese.organizacaoNome}"></span> | 
                            <strong>Status:</strong> <span class="badge bg-secondary" th:text="${catequese.status}"></span>
                        </p>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{/catequeses/{uuid}(uuid=${catequese.uuid})}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Voltar à Catequese
                        </a>
                        <a th:href="@{/catequeses/{uuid}/etapas/nova(uuid=${catequese.uuid})}" class="btn btn-eclesial">
                            <i class="bi bi-plus-lg me-1"></i> Nova Etapa
                        </a>
                    </div>
                </div>

                <th:block th:if="${#lists.isEmpty(etapas)}">
                    <section th:replace="~{fragments/layout :: empty-state('Nenhuma etapa cadastrada.', 'Cadastre as etapas formativas para este ciclo de catequese.')}"></section>
                </th:block>

                <div class="card shadow-sm border-0" th:unless="${#lists.isEmpty(etapas)}">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 80px;">Ordem</th>
                                    <th>Nome</th>
                                    <th>Descrição</th>
                                    <th>Ativa</th>
                                    <th class="text-end pe-3">Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="etapa : ${etapas}">
                                    <td>
                                        <span class="badge rounded-pill bg-light text-dark border px-3" th:text="${etapa.ordem}"></span>
                                    </td>
                                    <td class="fw-semibold text-dark" th:text="${etapa.nome}"></td>
                                    <td class="text-muted" th:text="${etapa.descricao ?: '-'}"></td>
                                    <td>
                                        <span th:if="${etapa.ativo}" class="badge bg-success-subtle text-success border border-success-subtle">Sim</span>
                                        <span th:unless="${etapa.ativo}" class="badge bg-secondary-subtle text-secondary border border-secondary-subtle">Não</span>
                                    </td>
                                    <td class="text-end pe-3">
                                        <div class="btn-group">
                                            <a th:href="@{/catequeses/{catequeseUuid}/etapas/{uuid}/editar(catequeseUuid=${catequese.uuid},uuid=${etapa.uuid})}" 
                                               class="btn btn-sm btn-outline-secondary" title="Editar">
                                                <i class="bi bi-pencil me-1"></i> Editar
                                            </a>
                                            <a th:href="@{/catequeses/etapas/{uuid}/turmas(uuid=${etapa.uuid})}" 
                                               class="btn btn-sm btn-outline-primary" title="Ver Turmas">
                                                <i class="bi bi-people me-1"></i> Turmas
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
