<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets(${projetoUuid != null ? 'Editar Projeto / Obra - ADM Eclesial' : 'Novo Projeto / Obra - ADM Eclesial'})}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h3 mb-1 text-gray-800" th:text="${projetoUuid != null ? 'Editar Projeto / Obra' : 'Novo Projeto / Obra'}">Novo Projeto / Obra</h1>
                        <p class="text-muted mb-0" th:text="${projetoUuid != null ? 'Atualize as informações do projeto ou obra' : 'Cadastre uma iniciativa paroquial, construção ou reforma'}">Cadastre uma iniciativa paroquial, construção ou reforma</p>
                    </div>
                    <a href="/projetos" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Voltar para Projetos
                    </a>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <form method="post" th:action="${projetoUuid != null ? '/projetos/' + projetoUuid + '/editar' : '/projetos'}" th:object="${projeto}">
                        <div th:replace="~{fragments/layout :: formErrors}"></div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">UUID da Organização <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{organizacaoEclesialUuid}" class="form-control" required placeholder="Cole o UUID da organização eclesial">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">UUID Item Orçamento</label>
                                    <input type="text" th:field="*{itemOrcamentoUuid}" class="form-control" placeholder="UUID do item orçamentário (opcional)">
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-8">
                                    <label class="form-label fw-semibold">Nome do Projeto <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{nome}" class="form-control" required placeholder="Ex: Reforma do Telhado da Matriz">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Tipo <span class="text-danger">*</span></label>
                                    <select th:field="*{tipo}" class="form-select" required>
                                        <option th:each="x:${tipos}" th:value="${x}" th:text="${x}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Data de Início</label>
                                    <input type="date" th:field="*{dataInicio}" class="form-control">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Data de Término Estimada</label>
                                    <input type="date" th:field="*{dataFim}" class="form-control">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Valor Estimado (R$)</label>
                                    <input type="number" step="0.01" th:field="*{valorEstimado}" class="form-control" placeholder="0.00">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Descrição do Projeto</label>
                                <textarea th:field="*{descricao}" class="form-control" rows="4" placeholder="Detalhamento técnico, escopo e justificativa da obra ou projeto..."></textarea>
                            </div>

                            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                <a href="/projetos" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                                <button type="submit" class="btn btn-eclesial">
                                    <i class="bi bi-check-lg me-1"></i> <span th:text="${projetoUuid != null ? 'Atualizar Projeto' : 'Salvar Projeto'}">Salvar Projeto</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
