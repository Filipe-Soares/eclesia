<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Recursos Vinculados - ADM Eclesial')}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h3 mb-1 text-gray-800">Recursos Vinculados</h1>
                        <p class="text-muted mb-0">
                            Fundos e recursos destinados a projetos específicos | 
                            <strong>Destinações cadastradas:</strong> <span class="badge bg-light text-dark border" th:text="${#lists.size(destinacoes)}"></span>
                        </p>
                    </div>
                    <a href="/projetos" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Voltar para Projetos
                    </a>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>UUID</th>
                                    <th>Finalidade</th>
                                    <th>Valor Original</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(recursos)}">
                                    <td colspan="4" class="text-center text-muted py-3">Nenhum recurso vinculado encontrado.</td>
                                </tr>
                                <tr th:each="x:${recursos}">
                                    <td class="font-monospace small text-muted" th:text="${x.uuid}"></td>
                                    <td class="fw-semibold text-dark" th:text="${x.finalidade}"></td>
                                    <td class="fw-bold text-success" th:text="${x.valorOriginal}"></td>
                                    <td>
                                        <span class="badge bg-primary-subtle text-primary border border-primary-subtle" th:text="${x.status}"></span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
