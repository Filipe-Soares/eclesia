<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Detalhes do Projeto - ADM Eclesial')}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <h1 class="h3 mb-0 text-gray-800" th:text="${projeto.nome}">Projeto</h1>
                            <span class="badge bg-primary-subtle text-primary border border-primary-subtle" th:text="${projeto.status}"></span>
                        </div>
                        <p class="text-muted mb-0">
                            <strong>Tipo:</strong> <span th:text="${projeto.tipo}"></span> | 
                            <strong>Valor Estimado:</strong> <span class="fw-bold text-dark" th:text="${projeto.valorEstimado}"></span>
                        </p>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="/projetos" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Voltar para Projetos
                        </a>
                        <a th:href="@{'/projetos/' + ${projeto.uuid} + '/editar'}" class="btn btn-outline-primary">
                            <i class="bi bi-pencil me-1"></i> Editar
                        </a>
                    </div>
                </div>

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-light fw-semibold">
                        <i class="bi bi-pie-chart me-1"></i> Fontes de Recurso Alocadas
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID Recurso Vinculado</th>
                                        <th class="text-end pe-3">Valor Alocado</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${#lists.isEmpty(fontes)}">
                                        <td colspan="2" class="text-center text-muted py-3">Nenhuma fonte de recurso alocada para este projeto.</td>
                                    </tr>
                                    <tr th:each="x:${fontes}">
                                        <td class="fw-semibold text-dark" th:text="${x.recursoVinculadoId}"></td>
                                        <td class="text-end pe-3 fw-bold text-success" th:text="${x.valorAlocado}"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
