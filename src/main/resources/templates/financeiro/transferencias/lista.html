<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Transferências Financeiras - ADM Eclesial')}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h3 mb-1 text-gray-800">Transferências Financeiras</h1>
                        <p class="text-muted mb-0">Movimentações entre contas da mesma organização</p>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="/financeiro" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Financeiro</a>
                        <a href="/financeiro/transferencias/nova" class="btn btn-eclesial"><i class="bi bi-plus-lg me-1"></i> Nova Transferência</a>
                    </div>
                </div>

                <th:block th:if="${#lists.isEmpty(transferencias)}">
                    <section th:replace="~{fragments/layout :: empty-state('Nenhuma transferência registrada.', 'Registre transferências entre contas da mesma organização.')}"></section>
                </th:block>

                <div class="card shadow-sm border-0" th:unless="${#lists.isEmpty(transferencias)}">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Data</th>
                                    <th>Origem</th>
                                    <th>Destino</th>
                                    <th class="text-end">Valor</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="x:${transferencias}">
                                    <td th:text="${x.dataTransferencia}"></td>
                                    <td th:text="${contasPorId.get(x.contaOrigemId)} ?: '—'"></td>
                                    <td th:text="${contasPorId.get(x.contaDestinoId)} ?: '—'"></td>
                                    <td class="text-end fw-semibold" th:text="${x.valor}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
