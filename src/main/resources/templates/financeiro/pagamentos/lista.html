<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Pagamentos - ADM Eclesial')}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h3 mb-1 text-gray-800">Pagamentos</h1>
                        <p class="text-muted mb-0">Baixas de parcelas de contas a pagar</p>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="/financeiro" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Financeiro</a>
                        <a href="/financeiro/pagamentos/novo" class="btn btn-eclesial"><i class="bi bi-plus-lg me-1"></i> Novo Pagamento</a>
                    </div>
                </div>

                <th:block th:if="${#lists.isEmpty(pagamentos)}">
                    <section th:replace="~{fragments/layout :: empty-state('Nenhum pagamento registrado.', 'Registre pagamentos para quitar parcelas de contas a pagar.')}"></section>
                </th:block>

                <div class="card shadow-sm border-0" th:unless="${#lists.isEmpty(pagamentos)}">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Data</th>
                                    <th>Meio de Pagamento</th>
                                    <th>Observação</th>
                                    <th class="text-end pe-3">Valor</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="x:${pagamentos}">
                                    <td th:text="${x.dataPagamento}"></td>
                                    <td><span class="badge bg-light text-dark border" th:text="${x.meioPagamento}"></span></td>
                                    <td th:text="${x.observacao} ?: '—'"></td>
                                    <td class="text-end pe-3 fw-bold text-danger" th:text="${x.valor}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
