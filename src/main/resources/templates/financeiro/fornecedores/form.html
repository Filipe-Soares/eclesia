<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Novo Fornecedor')}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h3 mb-1 text-gray-800">Novo Fornecedor</h1>
                        <p class="text-muted mb-0">Informe tipo de pessoa, nome e dados de contato</p>
                    </div>
                    <a href="/financeiro/fornecedores" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Voltar</a>
                </div>

                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <form method="post" action="/financeiro/fornecedores" th:object="${request}">
                        <div th:replace="~{fragments/layout :: formErrors}"></div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Tipo de Pessoa <span class="text-danger">*</span></label>
                                    <select th:field="*{tipoPessoa}" class="form-select" required>
                                        <option value="">Selecione</option>
                                        <option th:each="x:${tiposPessoa}" th:value="${x}" th:text="${x}"></option>
                                    </select>
                                </div>
                                <div class="col-md-8">
                                    <label class="form-label fw-semibold">Nome <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{nome}" class="form-control" required>
                                </div>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">CPF/CNPJ</label>
                                    <input type="text" inputmode="numeric" th:field="*{cpfCnpj}" class="form-control" placeholder="Somente números">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">E-mail</label>
                                    <input type="email" th:field="*{email}" class="form-control">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Telefone</label>
                                    <input type="text" th:field="*{telefone}" class="form-control">
                                </div>
                            </div>
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" th:field="*{ativo}" id="ativo">
                                <label class="form-check-label" for="ativo">Fornecedor ativo</label>
                            </div>
                            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                <a href="/financeiro/fornecedores" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-eclesial"><i class="bi bi-check-lg me-1"></i> Salvar Fornecedor</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
