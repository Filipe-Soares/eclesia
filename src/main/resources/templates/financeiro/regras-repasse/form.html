<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Nova Regra de Repasse')}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h3 mb-1 text-gray-800">Nova Regra de Repasse</h1>
                        <p class="text-muted mb-0">Percentual ou valor fixo — informe apenas um dos dois</p>
                    </div>
                    <a href="/financeiro/regras-repasse" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Voltar</a>
                </div>

                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <form method="post" action="/financeiro/regras-repasse" th:object="${request}">
                        <div th:replace="~{fragments/layout :: formErrors}"></div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Organização de Origem <span class="text-danger">*</span></label>
                                    <select th:field="*{organizacaoOrigemUuid}" class="form-select" required>
                                        <option value="">Selecione</option>
                                        <option th:each="o:${organizacoes}" th:value="${o.uuid}" th:text="${o.nome}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Organização de Destino <span class="text-danger">*</span></label>
                                    <select th:field="*{organizacaoDestinoUuid}" class="form-select" required>
                                        <option value="">Selecione</option>
                                        <option th:each="o:${organizacoes}" th:value="${o.uuid}" th:text="${o.nome}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Tipo de Base <span class="text-danger">*</span></label>
                                    <select th:field="*{tipoBase}" class="form-select" required>
                                        <option value="">Selecione</option>
                                        <option th:each="x:${tiposBase}" th:value="${x}" th:text="${x}"></option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Percentual (%)</label>
                                    <input type="number" step="0.0001" min="0" max="100" th:field="*{percentual}" class="form-control">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Valor Fixo (R$)</label>
                                    <input type="number" step="0.01" min="0" th:field="*{valorFixo}" class="form-control">
                                </div>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Periodicidade <span class="text-danger">*</span></label>
                                    <select th:field="*{periodicidade}" class="form-select" required>
                                        <option value="">Selecione</option>
                                        <option th:each="x:${periodicidades}" th:value="${x}" th:text="${x}"></option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Início <span class="text-danger">*</span></label>
                                    <input type="date" th:field="*{dataInicio}" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Fim</label>
                                    <input type="date" th:field="*{dataFim}" class="form-control">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Observação</label>
                                <textarea th:field="*{observacao}" rows="2" class="form-control"></textarea>
                            </div>
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" th:field="*{ativo}" id="ativo">
                                <label class="form-check-label" for="ativo">Regra ativa</label>
                            </div>
                            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                <a href="/financeiro/regras-repasse" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-eclesial"><i class="bi bi-check-lg me-1"></i> Salvar Regra</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
