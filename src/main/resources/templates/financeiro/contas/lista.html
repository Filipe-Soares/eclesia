<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Contas Financeiras - ADM Eclesial')}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h3 mb-1 text-gray-800">Contas Financeiras</h1>
                        <p class="text-muted mb-0">Contas correntes, caixas e aplicações da organização</p>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="/financeiro" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Financeiro</a>
                        <a href="/financeiro/contas/nova" class="btn btn-eclesial"><i class="bi bi-plus-lg me-1"></i> Nova Conta</a>
                    </div>
                </div>

                <th:block th:if="${#lists.isEmpty(contas)}">
                    <section th:replace="~{fragments/layout :: empty-state('Nenhuma conta financeira cadastrada.', 'Cadastre a primeira conta para iniciar o controle financeiro.')}"></section>
                </th:block>

                <div class="card shadow-sm border-0" th:unless="${#lists.isEmpty(contas)}">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Nome</th>
                                    <th>Tipo</th>
                                    <th>Banco</th>
                                    <th>Agência / Número</th>
                                    <th>Situação</th>
                                    <th class="text-end pe-3">Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="x:${contas}">
                                    <td class="fw-semibold text-dark" th:text="${x.nome}"></td>
                                    <td><span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle" th:text="${x.tipo}"></span></td>
                                    <td th:text="${x.banco} ?: '—'"></td>
                                    <td th:text="${x.agencia != null or x.numero != null} ? (${x.agencia} ?: '') + ' / ' + (${x.numero} ?: '') : '—'"></td>
                                    <td>
                                        <span class="badge" th:classappend="${x.ativo} ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-danger-subtle text-danger border border-danger-subtle'" th:text="${x.ativo} ? 'Ativa' : 'Inativa'"></span>
                                    </td>
                                    <td class="text-end pe-3">
                                        <a th:href="@{'/financeiro/contas/'+${x.uuid}+'/editar'}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil me-1"></i> Editar</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
