<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Orçamentos - ADM Eclesial')}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h3 mb-1 text-gray-800">Orçamentos</h1>
                        <p class="text-muted mb-0">Um orçamento por organização e ano</p>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="/financeiro" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Financeiro</a>
                        <a href="/financeiro/orcamentos/novo" class="btn btn-eclesial"><i class="bi bi-plus-lg me-1"></i> Novo Orçamento</a>
                    </div>
                </div>

                <th:block th:if="${#lists.isEmpty(orcamentos)}">
                    <section th:replace="~{fragments/layout :: empty-state('Nenhum orçamento cadastrado.', 'Crie um orçamento anual para planejar receitas e despesas.')}"></section>
                </th:block>

                <div class="card shadow-sm border-0" th:unless="${#lists.isEmpty(orcamentos)}">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Ano</th>
                                    <th>Nome</th>
                                    <th>Status</th>
                                    <th class="text-end pe-3">Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="x:${orcamentos}">
                                    <td class="fw-bold" th:text="${x.ano}"></td>
                                    <td class="fw-semibold text-dark" th:text="${x.nome}"></td>
                                    <td><span class="badge bg-primary-subtle text-primary border border-primary-subtle" th:text="${x.status}"></span></td>
                                    <td class="text-end pe-3">
                                        <a th:href="@{'/financeiro/orcamentos/'+${x.uuid}}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-eye me-1"></i> Detalhes</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
