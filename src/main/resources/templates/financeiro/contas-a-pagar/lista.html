<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Contas a Pagar - ADM Eclesial')}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h3 mb-1 text-gray-800">Contas a Pagar</h1>
                        <p class="text-muted mb-0">Compromissos com fornecedores e obrigações de repasse</p>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="/financeiro" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Financeiro</a>
                        <a href="/financeiro/contas-a-pagar/nova" class="btn btn-eclesial"><i class="bi bi-plus-lg me-1"></i> Nova Conta a Pagar</a>
                    </div>
                </div>

                <th:block th:if="${#lists.isEmpty(contas)}">
                    <section th:replace="~{fragments/layout :: empty-state('Nenhuma conta a pagar cadastrada.', 'Cadastre contas a pagar para registrar os compromissos financeiros.')}"></section>
                </th:block>

                <div class="card shadow-sm border-0" th:unless="${#lists.isEmpty(contas)}">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Descrição</th>
                                    <th>Organização</th>
                                    <th>Fornecedor</th>
                                    <th>Vencimento</th>
                                    <th class="text-end">Valor Total</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="x:${contas}">
                                    <td class="fw-semibold text-dark" th:text="${x.descricao}"></td>
                                    <td th:text="${orgsPorId.get(x.organizacaoEclesialId)} ?: '—'"></td>
                                    <td th:text="${x.fornecedorId != null} ? (${fornecedoresPorId.get(x.fornecedorId)} ?: '—') : (${x.obrigacaoRepasseId != null} ? 'Repasse' : '—')"></td>
                                    <td th:text="${x.dataVencimento}"></td>
                                    <td class="text-end fw-bold text-danger" th:text="${x.valorTotal}"></td>
                                    <td><span class="badge bg-warning-subtle text-warning border border-warning-subtle" th:text="${x.status}"></span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
