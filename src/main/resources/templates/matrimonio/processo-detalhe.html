<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Processo Matrimonial - ADM Eclesial')}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <h1 class="h3 mb-0 text-gray-800">Processo Matrimonial</h1>
                            <span class="badge bg-primary-subtle text-primary border border-primary-subtle" th:text="${processo.status}"></span>
                        </div>
                        <p class="text-muted mb-0">
                            <i class="bi bi-heart-fill text-danger me-1"></i>
                            <span class="fw-semibold" th:text="${processo.nubente1 + ' e ' + processo.nubente2}"></span>
                        </p>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="/processos-matrimoniais" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Voltar aos Processos
                        </a>
                        <a th:href="@{'/processos-matrimoniais/' + ${processo.uuid} + '/editar'}" class="btn btn-outline-primary">
                            <i class="bi bi-pencil me-1"></i> Editar
                        </a>
                    </div>
                </div>

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-light fw-semibold">
                        <i class="bi bi-gear me-1"></i> Ações do Processo
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <a th:href="@{'/processos-matrimoniais/' + ${processo.uuid} + '/celebracao'}" class="btn btn-outline-primary p-3 w-100 d-flex align-items-center justify-content-between">
                                    <div class="text-start">
                                        <div class="fw-semibold"><i class="bi bi-calendar-heart me-2"></i> Registrar Celebração</div>
                                        <small class="text-muted">Data, local e celebrante da cerimônia</small>
                                    </div>
                                    <i class="bi bi-chevron-right"></i>
                                </a>
                            </div>
                            <div class="col-md-6">
                                <a th:href="@{'/processos-matrimoniais/' + ${processo.uuid} + '/registro'}" class="btn btn-outline-primary p-3 w-100 d-flex align-items-center justify-content-between">
                                    <div class="text-start">
                                        <div class="fw-semibold"><i class="bi bi-journal-check me-2"></i> Registrar Matrimônio</div>
                                        <small class="text-muted">Assentamento canônico definitivo</small>
                                    </div>
                                    <i class="bi bi-chevron-right"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
