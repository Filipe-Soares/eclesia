<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Registro de Matrimônio - ADM Eclesial')}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h3 mb-1 text-gray-800">Registro de Matrimônio</h1>
                        <p class="text-muted mb-0">
                            <strong>Nubentes:</strong> <span class="fw-semibold" th:text="${processo.nubente1 + ' e ' + processo.nubente2}"></span>
                        </p>
                    </div>
                    <a th:href="@{'/processos-matrimoniais/' + ${processo.uuid}}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Voltar ao Processo
                    </a>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <form method="post" th:action="@{'/processos-matrimoniais/' + ${processo.uuid} + '/registro'}">

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">UUID da Celebração <span class="text-danger">*</span></label>
                                    <input type="text" name="celebracaoUuid" class="form-control" required placeholder="Cole o UUID da celebração vinculada">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Data do Registro <span class="text-danger">*</span></label>
                                    <input type="date" name="dataRegistro" class="form-control" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Observações</label>
                                <textarea name="observacao" class="form-control" rows="4" placeholder="Observações e anotações canônicas do registro..."></textarea>
                            </div>

                            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                <a th:href="@{'/processos-matrimoniais/' + ${processo.uuid}}" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                                <button type="submit" class="btn btn-eclesial">
                                    <i class="bi bi-journal-check me-1"></i> Registrar Matrimônio
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
