<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Famílias')}">
  <meta charset="UTF-8">
  <title>Famílias - ADM Eclesial</title>
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar}"></aside>

  <main class="app-main">
    <div class="page">

      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-4 pb-2 border-bottom">
        <div>
          <h1 class="h3 fw-bold text-dark mb-1">
            <i class="bi bi-people-fill text-primary me-2"></i>Famílias
          </h1>
          <p class="text-muted small mb-0">Agrupamentos opcionais de pessoas (núcleos familiares)</p>
        </div>
        <div class="d-flex gap-2 flex-wrap">
          <a class="btn btn-eclesial d-flex align-items-center gap-1 shadow-sm" th:href="@{/familias/nova}">
            <i class="bi bi-plus-lg"></i>
            <span>Nova Família</span>
          </a>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: feedback}"></div>

      <th:block th:if="${#lists.isEmpty(familias)}">
        <section th:replace="~{fragments/layout :: empty-state('Nenhuma família cadastrada.', 'Crie uma família e associe seus membros quando houver necessidade pastoral ou administrativa.')}">
        </section>
      </th:block>

      <div class="card border-0 shadow-sm" th:unless="${#lists.isEmpty(familias)}">
        <div class="table-responsive">
          <table class="table table-hover table-striped align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3">Nome</th>
                <th>Situação</th>
                <th class="text-end pe-3">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="f : ${familias}">
                <td class="ps-3 fw-medium text-dark" th:text="${f.nome}"></td>
                <td>
                  <span class="badge" th:classappend="${f.ativo} ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-danger-subtle text-danger border border-danger-subtle'" th:text="${f.ativo ? 'Ativa' : 'Inativa'}"></span>
                </td>
                <td class="text-end pe-3">
                  <div class="d-inline-flex gap-1">
                    <a class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center gap-1" th:href="@{/familias/{uuid}(uuid=${f.uuid})}">
                      <i class="bi bi-eye"></i>
                      <span>Detalhes</span>
                    </a>
                    <a class="btn btn-sm btn-outline-primary d-inline-flex align-items-center gap-1" th:href="@{/familias/{uuid}/editar(uuid=${f.uuid})}">
                      <i class="bi bi-pencil"></i>
                      <span>Editar</span>
                    </a>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>

</body>
</html>
