<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Sacramentos - ADM Eclesial')}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h3 mb-1 text-gray-800">Sacramentos</h1>
                        <p class="text-muted mb-0">Celebrações e registros sacramentais da paróquia e comunidades</p>
                    </div>
                    <a sec:authorize="hasAnyRole('ADMINISTRADOR','SECRETARIA')" href="/sacramentos/novo" class="btn btn-eclesial">
                        <i class="bi bi-plus-lg me-1"></i> Novo Sacramento
                    </a>
                </div>

                <th:block th:if="${#lists.isEmpty(sacramentos)}">
                    <section th:replace="~{fragments/layout :: empty-state('Nenhum sacramento registrado.', 'Ainda não há celebrações sacramentais registradas para exibir.')}"></section>
                </th:block>

                <div class="card shadow-sm border-0" th:unless="${#lists.isEmpty(sacramentos)}">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Data Celebração</th>
                                    <th>Tipo</th>
                                    <th>Organização</th>
                                    <th>Local</th>
                                    <th>Status</th>
                                    <th class="text-end pe-3">Ações</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="s : ${sacramentos}">
                                    <td>
                                        <i class="bi bi-calendar-event me-1 text-muted"></i>
                                        <span th:text="${s.dataCelebracao}"></span>
                                    </td>
                                    <td>
                                        <span class="badge bg-primary-subtle text-primary border border-primary-subtle fw-semibold" th:text="${s.tipo}"></span>
                                    </td>
                                    <td class="text-dark fw-medium" th:text="${s.organizacaoNome}"></td>
                                    <td class="text-muted" th:text="${s.local ?: '-'}"></td>
                                    <td>
                                        <span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle" th:text="${s.status}"></span>
                                    </td>
                                    <td class="text-end pe-3">
                                        <div class="btn-group">
                                            <a th:href="@{/sacramentos/{uuid}(uuid=${s.uuid})}" class="btn btn-sm btn-outline-secondary" title="Ver Detalhes">
                                                <i class="bi bi-eye me-1"></i> Detalhes
                                            </a>
                                            <a sec:authorize="hasAnyRole('ADMINISTRADOR','SECRETARIA')" th:href="@{/sacramentos/{uuid}/editar(uuid=${s.uuid})}" class="btn btn-sm btn-outline-secondary" title="Editar">
                                                <i class="bi bi-pencil me-1"></i> Editar
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
