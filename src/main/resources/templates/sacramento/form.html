<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets(${sacramentoUuid != null ? 'Editar Sacramento' : 'Novo Sacramento'} + ' - ADM Eclesial')}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h3 mb-1 text-gray-800" th:text="${sacramentoUuid != null ? 'Editar Sacramento' : 'Novo Sacramento'}"></h1>
                        <p class="text-muted mb-0">Informe os dados da celebração sacramental</p>
                    </div>
                    <a href="/sacramentos" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Voltar para Sacramentos
                    </a>
                </div>

                <div th:if="${businessError}" class="alert alert-danger mb-4" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${businessError}"></span>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <form th:action="${sacramentoUuid != null ? '/sacramentos/' + sacramentoUuid : '/sacramentos'}" th:object="${request}" method="post">
      <div th:replace="~{fragments/layout :: formErrors}"></div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Organização Eclesial <span class="text-danger">*</span></label>
                                    <select th:field="*{organizacaoEclesialUuid}" class="form-select" required>
                                        <option value="">Selecione a organização</option>
                                        <option th:each="o : ${organizacoes}" th:value="${o.uuid}" th:text="${o.nome}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Tipo de Sacramento <span class="text-danger">*</span></label>
                                    <select th:field="*{tipo}" class="form-select" required>
                                        <option value="">Selecione o tipo</option>
                                        <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Data da Celebração <span class="text-danger">*</span></label>
                                    <input type="date" th:field="*{dataCelebracao}" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Local / Igreja</label>
                                    <input type="text" th:field="*{local}" class="form-control" placeholder="Ex: Matriz de São José">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Status</label>
                                    <select th:field="*{status}" class="form-select">
                                        <option value="">REGISTRADO</option>
                                        <option th:each="s : ${status}" th:value="${s}" th:text="${s}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Observações</label>
                                <textarea th:field="*{observacao}" class="form-control" rows="4" placeholder="Detalhes adicionais sobre a celebração sacramental..."></textarea>
                            </div>

                            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                <a href="/sacramentos" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                                <button type="submit" class="btn btn-eclesial">
                                    <i class="bi bi-check-lg me-1"></i> Salvar Sacramento
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
