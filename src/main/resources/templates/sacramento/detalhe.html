<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Detalhes do Sacramento - ADM Eclesial')}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <h1 class="h3 mb-0 text-gray-800" th:text="${sacramento.tipo}">Sacramento</h1>
                            <span class="badge bg-primary-subtle text-primary border border-primary-subtle" th:text="${sacramento.status}"></span>
                        </div>
                        <p class="text-muted mb-0">
                            <strong>Organização:</strong> <span th:text="${sacramento.organizacaoNome}"></span>
                        </p>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="/sacramentos" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Voltar à Lista
                        </a>
                        <a sec:authorize="hasAnyRole('ADMINISTRADOR','SECRETARIA')" th:href="@{/sacramentos/{uuid}/editar(uuid=${sacramento.uuid})}" class="btn btn-outline-primary">
                            <i class="bi bi-pencil me-1"></i> Editar
                        </a>
                    </div>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-light fw-semibold">
                                <i class="bi bi-info-circle me-1"></i> Informações da Celebração
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <small class="text-muted d-block">Data da Celebração</small>
                                    <span class="fw-semibold fs-6" th:text="${sacramento.dataCelebracao}"></span>
                                </div>
                                <div class="mb-3">
                                    <small class="text-muted d-block">Local / Igreja</small>
                                    <span class="fw-semibold text-dark" th:text="${sacramento.local ?: 'Não informado'}"></span>
                                </div>
                                <div>
                                    <small class="text-muted d-block">Observações</small>
                                    <p class="mb-0 text-muted" th:text="${sacramento.observacao ?: 'Nenhuma observação registrada.'}"></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-light fw-semibold">
                                <i class="bi bi-lightning-charge me-1"></i> Gestão do Sacramento
                            </div>
                            <div class="card-body d-flex flex-column justify-content-center gap-3">
                                <a th:href="@{/sacramentos/{uuid}/participantes(uuid=${sacramento.uuid})}" class="btn btn-outline-primary p-3 d-flex align-items-center justify-content-between">
                                    <div class="text-start">
                                        <div class="fw-semibold"><i class="bi bi-people me-2"></i> Participantes</div>
                                        <small class="text-muted">Celebrantes, padrinhos, testemunhas e recebedores</small>
                                    </div>
                                    <i class="bi bi-chevron-right"></i>
                                </a>
                                <a th:href="@{/sacramentos/{uuid}/registro(uuid=${sacramento.uuid})}" class="btn btn-outline-primary p-3 d-flex align-items-center justify-content-between">
                                    <div class="text-start">
                                        <div class="fw-semibold"><i class="bi bi-journal-bookmark me-2"></i> Registro Sacramental</div>
                                        <small class="text-muted">Livro, folhas, termos e dados do cartório/cúria</small>
                                    </div>
                                    <i class="bi bi-chevron-right"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
