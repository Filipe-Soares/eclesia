<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Relacionamentos')}">
  <meta charset="UTF-8">
  <title>Relacionamentos - ADM Eclesial</title>
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar}"></aside>

  <main class="app-main">
    <div class="page">

      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-4 pb-2 border-bottom">
        <div>
          <h1 class="h3 fw-bold text-dark mb-1">
            <i class="bi bi-diagram-2 text-primary me-2"></i>Relacionamentos entre Pessoas
          </h1>
          <p class="text-muted small mb-0">Vínculos familiares registrados (a reciprocidade é mantida automaticamente)</p>
        </div>
        <div>
          <a class="btn btn-outline-secondary d-flex align-items-center gap-1" th:href="@{/pessoas}">
            <i class="bi bi-people"></i>
            <span>Ir para Pessoas</span>
          </a>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: feedback}"></div>

      <th:block th:if="${#lists.isEmpty(relacionamentos)}">
        <section th:replace="~{fragments/layout :: empty-state('Nenhum relacionamento registrado.', 'Abra a ficha de uma pessoa para registrar relacionamentos familiares.')}">
        </section>
      </th:block>

      <div class="card border-0 shadow-sm" th:unless="${#lists.isEmpty(relacionamentos)}">
        <div class="table-responsive">
          <table class="table table-hover table-striped align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3">Tipo</th>
                <th>Início</th>
                <th>Fim</th>
                <th class="pe-3">Identificador</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="r : ${relacionamentos}">
                <td class="ps-3"><span class="badge bg-light text-dark border" th:text="${r.tipoRelacionamento}"></span></td>
                <td th:text="${r.dataInicio}"></td>
                <td th:text="${r.dataFim != null ? r.dataFim : '—'}"></td>
                <td class="pe-3 font-monospace small text-muted" th:text="${r.uuid}"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>

</body>
</html>
