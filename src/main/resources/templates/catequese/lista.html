<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Catequeses')}">
  <meta charset="UTF-8">
  <title>Catequeses - ADM Eclesial</title>
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar}"></aside>
  
  <main class="app-main">
    <div class="page">
      
      <!-- Cabeçalho -->
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-4 pb-2 border-bottom">
        <div>
          <h1 class="h3 fw-bold text-dark mb-1">
            <i class="bi bi-journal-bookmark text-primary me-2"></i>Gestão de Catequese
          </h1>
          <p class="text-muted small mb-0">Ciclos de formação, turmas, etapas e catequizandos</p>
        </div>
        <div class="d-flex gap-2 flex-wrap">
          <a class="btn btn-outline-secondary d-flex align-items-center gap-1" th:href="@{/organizacoes-eclesiais}">
            <i class="bi bi-diagram-3"></i>
            <span>Organizações</span>
          </a>
          <a class="btn btn-eclesial d-flex align-items-center gap-1 shadow-sm" th:href="@{/catequeses/nova}">
            <i class="bi bi-plus-lg"></i>
            <span>Nova Catequese</span>
          </a>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: feedback}"></div>

      <!-- Empty State -->
      <th:block th:if="${#lists.isEmpty(catequeses)}">
        <section th:replace="~{fragments/layout :: empty-state('Nenhuma catequese cadastrada.', 'Cadastre um ciclo de catequese para começar a vincular turmas e etapas.')}">
        </section>
      </th:block>

      <!-- Tabela de Listagem -->
      <div class="card border-0 shadow-sm" th:unless="${#lists.isEmpty(catequeses)}">
        <div class="table-responsive">
          <table class="table table-hover table-striped align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3">Nome do Ciclo</th>
                <th>Organização Eclesial</th>
                <th>Status</th>
                <th>Período</th>
                <th class="text-end pe-3">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="c : ${catequeses}">
                <td class="ps-3 fw-bold text-dark" th:text="${c.nome}"></td>
                <td class="text-muted" th:text="${c.organizacaoNome}"></td>
                <td>
                  <span class="badge" th:classappend="${c.status == 'ATIVA' or c.status == 'ATIVO'} ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-secondary-subtle text-dark border'" th:text="${c.status}"></span>
                </td>
                <td class="small text-muted">
                  <span th:text="${c.dataInicio != null ? #temporals.format(c.dataInicio, 'dd/MM/yyyy') : '-'}"></span>
                  <span> a </span>
                  <span th:text="${c.dataFim != null ? #temporals.format(c.dataFim, 'dd/MM/yyyy') : '-'}"></span>
                </td>
                <td class="text-end pe-3">
                  <div class="d-inline-flex gap-1">
                    <a class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center gap-1" th:href="@{/catequeses/{uuid}(uuid=${c.uuid})}">
                      <i class="bi bi-eye"></i>
                      <span>Detalhes</span>
                    </a>
                    <a class="btn btn-sm btn-outline-primary d-inline-flex align-items-center gap-1" th:href="@{/catequeses/{uuid}/editar(uuid=${c.uuid})}">
                      <i class="bi bi-pencil"></i>
                      <span>Editar</span>
                    </a>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>

</body>
</html>
