<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Registro Sacramental - ADM Eclesial')}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="app-main">
            <div class="page">
                <div th:replace="~{fragments/layout :: feedback}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h1 class="h3 mb-1 text-gray-800">Registro Sacramental</h1>
                        <p class="text-muted mb-0">Livro de registros e assentamento paroquial</p>
                    </div>
                    <a th:href="@{/sacramentos/{uuid}(uuid=${sacramentoUuid})}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Voltar ao Sacramento
                    </a>
                </div>

                <div th:if="${businessError}" class="alert alert-danger mb-4" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${businessError}"></span>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <form th:action="@{/sacramentos/{uuid}/registro(uuid=${sacramentoUuid})}" th:object="${request}" method="post">
      <div th:replace="~{fragments/layout :: formErrors}"></div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">Livro</label>
                                    <input type="text" th:field="*{livro}" class="form-control" placeholder="Ex: Livro 12-B">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">Folha</label>
                                    <input type="text" th:field="*{folha}" class="form-control" placeholder="Ex: Fl. 45">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">Termo</label>
                                    <input type="text" th:field="*{termo}" class="form-control" placeholder="Ex: Termo 89">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">Número do Registro</label>
                                    <input type="text" th:field="*{numeroRegistro}" class="form-control" placeholder="Ex: Reg. 1024">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Observações do Registro</label>
                                <textarea th:field="*{observacao}" class="form-control" rows="4" placeholder="Anotações marginais, autorizações ou averbações..."></textarea>
                            </div>

                            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                <a th:href="@{/sacramentos/{uuid}(uuid=${sacramentoUuid})}" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                                <button type="submit" class="btn btn-eclesial">
                                    <i class="bi bi-check-lg me-1"></i> Salvar Registro
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
