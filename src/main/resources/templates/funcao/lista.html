<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: assets('Funções Eclesiais')}">
  <meta charset="UTF-8">
  <title>Funções - ADM Eclesial</title>
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar}"></aside>
  
  <main class="app-main">
    <div class="page">
      
      <!-- Cabeçalho -->
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-4 pb-2 border-bottom">
        <div>
          <h1 class="h3 fw-bold text-dark mb-1">
            <i class="bi bi-briefcase text-primary me-2"></i>Funções Eclesiais
          </h1>
          <p class="text-muted small mb-0">Responsabilidades pastorais, ministeriais e administrativas</p>
        </div>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-secondary d-flex align-items-center gap-1" th:href="@{/vinculos-funcoes-eclesiais/novo}">
            <i class="bi bi-person-check"></i>
            <span>Atribuir Função</span>
          </a>
          <a class="btn btn-eclesial d-flex align-items-center gap-1 shadow-sm" th:href="@{/funcoes-eclesiais/nova}">
            <i class="bi bi-plus-lg"></i>
            <span>Nova Função</span>
          </a>
        </div>
      </div>

      <div th:replace="~{fragments/layout :: feedback}"></div>

      <!-- Empty State -->
      <th:block th:if="${#lists.isEmpty(funcoes)}">
        <section th:replace="~{fragments/layout :: empty-state('Nenhuma função cadastrada.', 'Cadastre uma função eclesial para permitir atribuições às pessoas vinculadas.')}">
        </section>
      </th:block>

      <!-- Tabela de Listagem -->
      <div class="card border-0 shadow-sm" th:unless="${#lists.isEmpty(funcoes)}">
        <div class="table-responsive">
          <table class="table table-hover table-striped align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3">Código</th>
                <th>Nome da Função</th>
                <th>Situação</th>
                <th>Exclusividade</th>
                <th class="text-end pe-3">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="f : ${funcoes}">
                <td class="ps-3 font-monospace fw-bold text-dark" th:text="${f.codigo}"></td>
                <td class="fw-medium text-dark" th:text="${f.nome}"></td>
                <td>
                  <span class="badge" th:classappend="${f.ativa} ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-danger-subtle text-danger border border-danger-subtle'" th:text="${f.ativa ? 'Ativa' : 'Inativa'}"></span>
                </td>
                <td>
                  <span class="badge" th:classappend="${f.exclusivoNaOrganizacao} ? 'bg-primary-subtle text-primary border border-primary-subtle' : 'bg-light text-muted border'" th:text="${f.exclusivoNaOrganizacao ? 'Exclusiva na Org.' : 'Múltipla'}"></span>
                </td>
                <td class="text-end pe-3">
                  <div class="d-inline-flex gap-1">
                    <a class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center gap-1" th:href="@{/funcoes-eclesiais/{uuid}(uuid=${f.uuid})}">
                      <i class="bi bi-eye"></i>
                      <span>Detalhes</span>
                    </a>
                    <a class="btn btn-sm btn-outline-primary d-inline-flex align-items-center gap-1" th:href="@{/funcoes-eclesiais/{uuid}/editar(uuid=${f.uuid})}">
                      <i class="bi bi-pencil"></i>
                      <span>Editar</span>
                    </a>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>

</body>
</html>
